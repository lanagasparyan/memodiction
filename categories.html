---
layout: default
title: Categories
---

<div class="container">
  <h1>Categories</h1>
  {% for category in site.categories %}
  <div class="card">
    <div class="card-header">
      <h2 class="mb-0">
        <button class="btn btn-link" type="button" data-toggle="collapse" data-target="#collapse-{{ forloop.index }}" aria-expanded="true" aria-controls="collapse-{{ forloop.index }}">
          {{ category[0] }}
        </button>
      </h2>
    </div>

    <div id="collapse-{{ forloop.index }}" class="collapse {% if forloop.first %}show{% endif %}" aria-labelledby="heading-{{ forloop.index }}">
      <div class="card-body">
        <ul>
          {% for post in category[1] %}
            <li><a href="{{ post.url }}">{{ post.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
{% endfor %}

</div>
